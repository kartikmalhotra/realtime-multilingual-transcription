# One-click deploy on Render (free tier works with STT_ENGINE=browser;
# Whisper needs a paid instance with >= 2 GB RAM).
services:
  - type: web
    name: realtime-transcription
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: STT_ENGINE
        value: whisper
      - key: WHISPER_MODEL
        value: small
      - key: DATABASE_URL
        fromDatabase:
          name: transcription-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: transcription-db
    databaseName: transcriptions
    user: postgres
    plan: basic-256mb
