# Render blueprint.
#
# Runs on Render's free plans: speech-to-text uses the Gemini Live API (the
# service named in the brief), so no model has to fit in the instance's
# 512 MB. Set GEMINI_API_KEY in the dashboard when the blueprint asks for it.
# Self-hosted Whisper needs real RAM - see "Running Whisper" below, because
# `small` alone is ~1.2 GB and will OOM a 512 MB instance.
services:
  - type: web
    name: realtime-transcription
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: STT_ENGINE
        value: gemini
      - key: DATABASE_URL
        fromDatabase:
          name: transcription-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: transcription-db
    databaseName: transcriptions
    user: postgres
    plan: free

# ---------------------------------------------------------------------
# Running Whisper (the self-hosted open-source engine) instead
# ---------------------------------------------------------------------
# 1. Move the web service to a plan with >= 2 GB RAM (standard or above).
# 2. Set     STT_ENGINE   = whisper
#            WHISPER_MODEL = small
# 3. Add the environment variable PREFETCH_MODEL = true (Render passes it
#    to the Docker build) so the weights are baked into the image; otherwise the first request downloads ~500 MB and times out
#    against the health check.
#
# Note that CPU-only instances run `small`, which transliterates English
# into Devanagari on mixed speech. large-v3-turbo keeps both scripts but
# needs a GPU to stay ahead of real time. See docs/ARCHITECTURE.md.
